<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设计稿对照</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, 'PingFang SC', sans-serif; background: #1a1a2e; color: #fff; }
.header { padding: 20px 32px; background: #2d2d4a; position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 20px; margin-bottom: 8px; }
.header p { font-size: 13px; color: #aaa; }
.tabs { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.tab-btn { padding: 6px 16px; border-radius: 6px; border: 1px solid #555; background: transparent; color: #ccc; cursor: pointer; font-size: 13px; transition: all .2s; }
.tab-btn:hover { border-color: #26C7A5; color: #fff; }
.tab-btn.active { background: #26C7A5; border-color: #26C7A5; color: #fff; }
.main { display: flex; min-height: calc(100vh - 120px); }
.design-panel { flex: 1; padding: 24px; overflow-y: auto; }
.design-panel h2 { font-size: 16px; margin-bottom: 16px; color: #ccc; }
.design-panel img { max-width: 100%; border-radius: 8px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); cursor: zoom-in; }
.design-panel img.zoomed { max-width: none; cursor: zoom-out; }
.prototype-panel { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 24px; }
.prototype-panel iframe { border: none; border-radius: 44px; box-shadow: 0 0 0 6px #2d2d4a, 0 0 0 8px #3d3d5a, 0 24px 64px rgba(0,0,0,0.5); width: 375px; height: 812px; }
.section { display: none; }
.section.active { display: block; }
.img-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.img-row img { flex: 1; min-width: 300px; }
.note { background: #2d2d4a; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; color: #aaa; border-left: 3px solid #26C7A5; }
</style>
</head>
<body>

<div class="header">
  <h1>设计稿 ↔ 原型 对照</h1>
  <p>左侧查看 Axure 设计稿，右侧查看交互原型。点击图片可放大。对照后告诉我差异点。</p>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchSection('contacts')">通讯录</button>
    <button class="tab-btn" onclick="switchSection('groupchat')">通讯录-群聊</button>
    <button class="tab-btn" onclick="switchSection('frienddetail')">好友详情</button>
    <button class="tab-btn" onclick="switchSection('addfriend')">添加好友</button>
    <button class="tab-btn" onclick="switchSection('org')">组织管理</button>
  </div>
</div>

<div class="main">
  <div class="design-panel">

    <div id="sec-contacts" class="section active">
      <h2>📱 通讯录 设计稿</h2>
      <div class="note">通讯录主页面设计，包含联系人列表、分组等</div>
      <div class="img-row">
        <img src="images/通讯录/u40277.png" onclick="toggleZoom(this)" alt="通讯录设计稿1">
        <img src="images/通讯录/u40278.png" onclick="toggleZoom(this)" alt="通讯录设计稿2">
      </div>
      <img src="images/通讯录/u40279.png" onclick="toggleZoom(this)" alt="通讯录设计稿3" style="max-width:400px;">
    </div>

    <div id="sec-groupchat" class="section">
      <h2>💬 通讯录-群聊 设计稿</h2>
      <div class="note">群聊列表及群聊详情设计</div>
      <div class="img-row">
        <img src="images/通讯录-群聊/u40284.png" onclick="toggleZoom(this)" alt="群聊设计稿1">
        <img src="images/通讯录-群聊/u40285.png" onclick="toggleZoom(this)" alt="群聊设计稿2">
      </div>
    </div>

    <div id="sec-frienddetail" class="section">
      <h2>👤 好友详情 设计稿</h2>
      <div class="note">好友详情页面设计</div>
      <div class="img-row">
        <img src="images/通讯录-好友详情/u40280.png" onclick="toggleZoom(this)" alt="好友详情1">
        <img src="images/通讯录-好友详情/u40281.png" onclick="toggleZoom(this)" alt="好友详情2">
      </div>
    </div>

    <div id="sec-addfriend" class="section">
      <h2>➕ 添加好友 设计稿</h2>
      <div class="note">添加好友页面设计</div>
      <div class="img-row">
        <img src="images/通讯录-添加好友/u40282.png" onclick="toggleZoom(this)" alt="添加好友1">
        <img src="images/通讯录-添加好友/u40283.png" onclick="toggleZoom(this)" alt="添加好友2">
      </div>
    </div>

    <div id="sec-org" class="section">
      <h2>🏢 组织管理 设计稿</h2>
      <div class="note">组织管理页面设计（SVG格式）</div>
      <div class="img-row">
        <img src="images/组织管理/u9749.svg" onclick="toggleZoom(this)" alt="组织管理1" style="background:#fff;max-width:400px;">
      </div>
    </div>

  </div>

  <div class="prototype-panel">
    <iframe src="移动端通讯录与群管理工作台原型.html"></iframe>
  </div>
</div>

<script>
function switchSection(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + name).classList.add('active');
  event.target.classList.add('active');
}
function toggleZoom(img) {
  img.classList.toggle('zoomed');
}
</script>

</body>
</html>
