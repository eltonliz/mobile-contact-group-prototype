        <div id="u23971_text" class="text ">
          <p><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">场次状态：由于我们没有自己的直拨端，依靠推拉流进行真是的直播，但是又要告诉用户的播前播中、预告的状态，因此单纯依据场次日期+时间是不可靠的</span></p><p><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">早于开始时间或没有产生推流</span><span style="font-family:'NunitoSans-Regular', 'Nunito Sans', sans-serif;">==</span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">预告</span></p><p><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">直播推流持续中==直播中</span></p><p><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">如果直播间开启回放，直播推流终止并且回放文件 == 回放中</span></p><p><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">如果直播间未开启回放 == 已结束</span></p><p><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;"><br></span></p><p><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">如果直播间开启回放，直播推流终止并且回放文件 == 回放中，并且当前时间 == 回放结束时间 == 已结束</span></p><p><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">人为终止计划、终止场次 == 已终止，且推流被主动切断</span></p>
